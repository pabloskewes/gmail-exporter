[project]
name = "gmail-exporter"
version = "0.1.0"
description = "Export Gmail threads to Markdown files with clean formatting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.23.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "typer>=0.9.0",
]

[project.scripts]
gmail-exporter = "gmail_exporter.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_exporter"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.15.0",
]
